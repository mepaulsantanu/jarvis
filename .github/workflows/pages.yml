# Builds the face and publishes it to GitHub Pages on every push to main.
# The brain (bridge/server.mjs) still runs on the local Mac; the hosted page
# talks to it at ws://localhost:8787.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same vendoring scripts/start.mjs does locally: serve MediaPipe's WASM
      # from our own origin so the CSP allows it.
      - run: mkdir -p public/mediapipe && cp -R node_modules/@mediapipe/tasks-vision/wasm/. public/mediapipe/
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
